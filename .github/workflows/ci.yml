name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare frontend bundle for Go embedding
        working-directory: frontend
        run: npm run build

      - name: Go tests
        run: go test . ./cmd/... ./database/... ./internal/...

      - name: Go vet
        run: go vet . ./cmd/... ./database/... ./internal/...

      - name: Install pinned Go verification tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Go vulnerability scan
        run: govulncheck . ./cmd/... ./database/... ./internal/...

      - name: Migration checksums
        shell: pwsh
        run: ./scripts/verify-migrations.ps1

      - name: Generate SQL access layer
        run: |
          sqlc generate -f database/sqlc.yaml
          git diff --exit-code -- database/gen

      - name: Secret scan
        shell: pwsh
        run: ./scripts/scan-secrets.ps1

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend tests
        working-directory: frontend
        run: npm run test:run

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Dependency audit
        working-directory: frontend
        run: npm audit

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build desktop executable
        run: wails build -clean

      - name: Build worker executable
        run: go build -trimpath -o build/bin/majucau-worker.exe ./cmd/worker

      - name: Build installer preflight helper
        run: go build -trimpath -o build/bin/installer-helper.exe ./cmd/installer-helper

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Verify installer source contract
        shell: pwsh
        run: ./scripts/test-installer-nsis.ps1

      - name: Build unsigned NSIS installer
        run: wails build -s -skipbindings -trimpath -nsis

      - name: Smoke install and uninstall unsigned installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath build/bin -Filter '*-installer.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Instalador NSIS não foi encontrado para o smoke.' }
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'majucau-install-smoke'
          $installDir = Join-Path $smokeRoot 'app'
          $dataDir = Join-Path $smokeRoot 'data'
          if (Test-Path -LiteralPath $smokeRoot) { Remove-Item -LiteralPath $smokeRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null

          & $installer.FullName /S "/D=$installDir"
          if ($LASTEXITCODE -ne 0) { throw "Instalação silenciosa falhou: $LASTEXITCODE" }
          foreach ($name in @('Majucau Financial Intelligence.exe', 'majucau-worker.exe', 'installer-helper.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $installDir $name) -PathType Leaf)) {
              throw "Arquivo ausente após instalação: $name"
            }
          }

          $helper = Join-Path $installDir 'installer-helper.exe'
          $preflightPath = Join-Path $smokeRoot 'preflight.json'
          & $helper preflight --install-dir $installDir --data-dir $dataDir --free-space-path $smokeRoot --min-free-bytes 1 --port 55439 |
            Set-Content -LiteralPath $preflightPath -Encoding utf8
          if ($LASTEXITCODE -notin @(0, 2)) { throw "Preflight pós-instalação falhou: $LASTEXITCODE" }
          $preflight = Get-Content -LiteralPath $preflightPath -Raw | ConvertFrom-Json
          if ($preflight.schema_version -ne '1.0') { throw 'Preflight pós-instalação sem schema esperado.' }

          $uninstaller = Join-Path $installDir 'uninstall.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw 'Uninstaller ausente.' }
          & $uninstaller /S
          if ($LASTEXITCODE -ne 0) { throw "Desinstalação silenciosa falhou: $LASTEXITCODE" }
          if (Test-Path -LiteralPath $installDir) { throw 'Diretório da aplicação permaneceu após desinstalação.' }

      - name: Upload unsigned G1 build
        uses: actions/upload-artifact@v4
        with:
          name: majucau-g1-unsigned
          path: |
            build/bin/majucau.exe
            build/bin/majucau-worker.exe
            build/bin/installer-helper.exe
            build/bin/*-installer.exe
          if-no-files-found: error

