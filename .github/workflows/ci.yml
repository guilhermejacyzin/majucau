name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      run_platform_checks: ${{ steps.classify.outputs.run_platform_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether product checks are needed
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "$PR_BASE_SHA" || -z "$PR_HEAD_SHA" ]]; then
              echo "run_platform_checks=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            diff_range="${PR_BASE_SHA}...${PR_HEAD_SHA}"
          elif [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "run_platform_checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            diff_range="${BEFORE_SHA}..${HEAD_SHA}"
          fi

          if ! changed_paths="$(git diff --name-only "$diff_range")"; then
            echo "run_platform_checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$changed_paths" ]]; then
            echo "run_platform_checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_checks=false
          while IFS= read -r path; do
            if [[ "$path" == docs/* || "$path" == artifacts/* || "$path" == *.md ]]; then
              continue
            fi
            run_checks=true
            break
          done <<< "$changed_paths"
          echo "run_platform_checks=$run_checks" >> "$GITHUB_OUTPUT"

      - name: Verify required commit message fields
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_DELETED: ${{ github.event.deleted }}
        run: python3 scripts/verify-commit-messages.py

      - name: Test commit-message checker handles unavailable prior tips
        run: python3 scripts/test_verify_commit_messages.py

  verify-backlog:
    # Backlog validation must run even when the change only updates docs.
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify backlog counts and progress percentages
        shell: pwsh
        run: ./scripts/verify-backlog.ps1

      - name: Verify backlog checker rejects inconsistent summaries
        shell: pwsh
        run: ./scripts/test-verify-backlog.ps1

  verify-windows:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_platform_checks == 'true' }}
    # Pin runner images so platform migrations are reviewed explicitly.
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GOCACHE: '${{ github.workspace }}\artifacts\cache\go-build'
      GOMODCACHE: '${{ github.workspace }}\artifacts\cache\go-mod'
      GOBIN: '${{ github.workspace }}\artifacts\cache\bin'
      npm_config_cache: '${{ github.workspace }}\artifacts\cache\npm'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare centralized caches
        shell: pwsh
        run: |
          $cacheRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\cache'
          foreach ($name in @('go-build', 'go-mod', 'bin', 'npm')) {
            New-Item -ItemType Directory -Force -Path (Join-Path $cacheRoot $name) | Out-Null
          }
          (Join-Path $cacheRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.0'
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare frontend bundle for Go embedding
        working-directory: frontend
        run: npm run build

      - name: Verify Go module files are tidy
        run: go mod tidy -diff

      - name: Go tests
        run: go test . ./cmd/... ./database/... ./internal/...

      - name: Verify Go architecture boundaries
        shell: pwsh
        run: ./scripts/verify-go-boundaries.ps1

      - name: Go vet
        run: go vet . ./cmd/... ./database/... ./internal/...

      - name: Install pinned Go verification tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tools = @(
            @{ Name = 'govulncheck'; Package = 'golang.org/x/vuln/cmd/govulncheck'; Version = 'v1.7.0' },
            @{ Name = 'sqlc'; Package = 'github.com/sqlc-dev/sqlc/cmd/sqlc'; Version = 'v1.31.1' },
            @{ Name = 'cyclonedx-gomod'; Package = 'github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod'; Version = 'v1.12.0' }
          )

          foreach ($tool in $tools) {
            $installed = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "Instalando $($tool.Name), tentativa $attempt de 3."
              & go install "$($tool.Package)@$($tool.Version)"
              $exitCode = $LASTEXITCODE
              if ($exitCode -eq 0) {
                $installed = $true
                break
              }
              if ($attempt -lt 3) {
                Start-Sleep -Seconds ([Math]::Pow(2, $attempt))
              }
            }

            if (-not $installed) {
              throw "A instalação de $($tool.Name) falhou após 3 tentativas."
            }

            $executable = Join-Path $env:GOBIN "$($tool.Name).exe"
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "A instalação de $($tool.Name) terminou sem criar o executável esperado."
            }
          }

      - name: Install pinned CycloneDX validator
        shell: pwsh
        run: |
          $validatorPath = Join-Path $env:GOBIN 'cyclonedx.exe'
          $validatorUrl = 'https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-win-x64.exe'
          curl.exe --fail --location --silent --show-error $validatorUrl --output $validatorPath
          if ($LASTEXITCODE -ne 0) { throw "Download do CycloneDX CLI falhou: $LASTEXITCODE" }

          $expectedSha256 = '9b360974c41a5d612eb026fb5e3bb1fa28e08865f7a4f915665b8bc94bd3bc31'
          $actualSha256 = (Get-FileHash -LiteralPath $validatorPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            Remove-Item -LiteralPath $validatorPath -Force
            throw "Hash do CycloneDX CLI divergente: $actualSha256"
          }
          & $validatorPath --version
          if ($LASTEXITCODE -ne 0) { throw "CycloneDX CLI não iniciou: $LASTEXITCODE" }

      - name: Go vulnerability scan
        run: govulncheck . ./cmd/... ./database/... ./internal/...

      - name: Migration checksums
        shell: pwsh
        run: ./scripts/verify-migrations.ps1

      - name: Generate SQL access layer
        run: |
          sqlc generate -f database/sqlc.yaml
          git diff --exit-code -- database/gen

      - name: Secret scan
        shell: pwsh
        run: ./scripts/scan-secrets.ps1

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend tests
        working-directory: frontend
        run: npm run test:run

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Dependency audit
        working-directory: frontend
        run: npm audit

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build desktop executable
        run: wails build -clean

      - name: Build worker executable
        run: go build -trimpath -o build/bin/majucau-worker.exe ./cmd/worker

      - name: Build installer preflight helper
        run: go build -trimpath -o build/bin/installer-helper.exe ./cmd/installer-helper

      - name: Smoke installer helper directly
        shell: pwsh
        run: |
          $helper = (Resolve-Path -LiteralPath 'build/bin/installer-helper.exe').Path
          $runSuffix = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $helperRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/verification/helper-smoke-$runSuffix"
          New-Item -ItemType Directory -Force -Path $helperRoot | Out-Null
          $preflightOut = Join-Path $helperRoot 'preflight.json'
          $preflight = Start-Process -FilePath $helper -ArgumentList @('preflight', '--install-dir', (Join-Path $helperRoot 'app'), '--data-dir', (Join-Path $helperRoot 'data'), '--free-space-path', $helperRoot, '--min-free-bytes', '1', '--port', '55439') -RedirectStandardOutput $preflightOut -PassThru
          if (-not $preflight.WaitForExit(30000)) { $preflight.Kill(); throw 'installer-helper preflight excedeu 30 segundos.' }
          if ($preflight.ExitCode -notin @(0, 2)) { throw "installer-helper preflight retornou $($preflight.ExitCode)." }
          $preflightJson = Get-Content -LiteralPath $preflightOut -Raw | ConvertFrom-Json
          if ($preflightJson.schema_version -ne '1.0') { throw 'installer-helper preflight sem schema.' }

          $diagnosticOut = Join-Path $helperRoot 'diagnostic.zip'
          $diagnosticsJsonOut = Join-Path $helperRoot 'diagnostics.json'
          $diagnostics = Start-Process -FilePath $helper -ArgumentList @('diagnostics', '--output', $diagnosticOut, '--install-dir', (Join-Path $helperRoot 'app'), '--data-dir', (Join-Path $helperRoot 'data'), '--free-space-path', $helperRoot, '--min-free-bytes', '1', '--port', '55439') -RedirectStandardOutput $diagnosticsJsonOut -PassThru
          if (-not $diagnostics.WaitForExit(30000)) { $diagnostics.Kill(); throw 'installer-helper diagnostics excedeu 30 segundos.' }
          if ($diagnostics.ExitCode -notin @(0, 2)) { throw "installer-helper diagnostics retornou $($diagnostics.ExitCode)." }
          if (-not (Test-Path -LiteralPath $diagnosticOut -PathType Leaf)) { throw 'installer-helper não produziu diagnóstico.' }

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsisVersion = '3.13'
          $expectedSha256 = 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8'
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $cacheToolsRoot = Join-Path $artifactRoot 'cache/tools'
          $toolsRoot = Join-Path $artifactRoot 'tools'
          $nsisRoot = Join-Path $toolsRoot "nsis-$nsisVersion"
          $archive = Join-Path $cacheToolsRoot "nsis-$nsisVersion.zip"
          New-Item -ItemType Directory -Force -Path $cacheToolsRoot, $toolsRoot | Out-Null

          if (-not (Test-Path -LiteralPath (Join-Path $nsisRoot 'Bin/makensis.exe') -PathType Leaf)) {
            Invoke-WebRequest -Uri "https://github.com/tauri-apps/binary-releases/releases/download/nsis-$nsisVersion/nsis-$nsisVersion.zip" -OutFile $archive -TimeoutSec 120
            $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256) {
              throw "SHA-256 do pacote NSIS $nsisVersion divergiu da versão fixada; download recusado."
            }
            Expand-Archive -LiteralPath $archive -DestinationPath $toolsRoot -Force
          }

          $compiler = Join-Path $nsisRoot 'Bin'
          if (-not (Test-Path -LiteralPath (Join-Path $compiler 'makensis.exe') -PathType Leaf)) {
            throw 'makensis.exe não foi localizado no pacote NSIS verificado.'
          }
          $compiler | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "NSISDIR=$nsisRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "NSIS: $nsisRoot"

      - name: Verify installer source contract
        shell: pwsh
        run: ./scripts/test-installer-nsis.ps1

      - name: Build unsigned NSIS installer
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { throw 'makensis não está no PATH do job.' }
          wails build -s -skipbindings -trimpath
          ./scripts/consolidate-artifacts.ps1 -KeepSourceOutputs
          ./scripts/write-release-manifest.ps1
          $runSuffix = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $verificationRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/verification'
          New-Item -ItemType Directory -Force -Path $verificationRoot | Out-Null
          $manifestVerification = Join-Path $verificationRoot "manifest-verification-$runSuffix.json"
          & (Resolve-Path -LiteralPath 'build/bin/installer-helper.exe').Path verify-package --package-dir (Resolve-Path -LiteralPath 'artifacts/windows').Path --manifest 'release-manifest.json' --current-schema '1.0' |
            Set-Content -LiteralPath $manifestVerification -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "PACKAGE_VERIFIED falhou: $LASTEXITCODE" }
          $manifestResult = Get-Content -LiteralPath $manifestVerification -Raw | ConvertFrom-Json
          if ($manifestResult.status -ne 'PACKAGE_VERIFIED') { throw 'Manifesto não retornou PACKAGE_VERIFIED.' }
          ./scripts/prepare-webview2.ps1
          Push-Location 'build/windows/installer'
          try { makensis project.nsi } finally { Pop-Location }
          $installer = Get-ChildItem -LiteralPath build/bin -Filter '*-installer.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Wails não produziu um instalador NSIS; nenhum warning pode ser tratado como sucesso.' }
          Write-Output "Installer: $($installer.FullName)"

      - name: Build portable bundle
        shell: pwsh
        run: ./scripts/package-portable.ps1

      - name: Smoke portable Windows bundle
        shell: pwsh
        run: ./scripts/smoke-windows.ps1

      - name: Generate dependency SBOMs and license evidence
        shell: pwsh
        run: |
          $sbomRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/verification/sbom'
          New-Item -ItemType Directory -Force -Path $sbomRoot | Out-Null
          $goSbomPath = Join-Path $sbomRoot 'majucau-go.cdx.json'
          cyclonedx-gomod mod -licenses -type application -std -json -output $goSbomPath .
          if ($LASTEXITCODE -ne 0) { throw "Geração do SBOM Go falhou: $LASTEXITCODE" }

          $npmSbomPath = Join-Path $sbomRoot 'frontend-npm.cdx.json'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'frontend')
          try {
            npm sbom --sbom-format=cyclonedx --package-lock-only |
              Set-Content -LiteralPath $npmSbomPath -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw "Geração do SBOM npm falhou: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          foreach ($path in @($goSbomPath, $npmSbomPath)) {
            $sbomFile = Get-Item -LiteralPath $path
            if ($sbomFile.Length -eq 0 -or $sbomFile.Length -gt 64MB) {
              throw "SBOM vazio ou acima do limite de 64 MiB: $path"
            }
          }

          & (Join-Path $env:GOBIN 'cyclonedx.exe') validate --input-file $goSbomPath --input-format json --input-version v1_6 --fail-on-errors
          if ($LASTEXITCODE -ne 0) { throw "Schema CycloneDX 1.6 inválido no SBOM Go: $LASTEXITCODE" }
          & (Join-Path $env:GOBIN 'cyclonedx.exe') validate --input-file $npmSbomPath --input-format json --input-version v1_5 --fail-on-errors
          if ($LASTEXITCODE -ne 0) { throw "Schema CycloneDX 1.5 inválido no SBOM npm: $LASTEXITCODE" }

          @(
            '## Inventário de dependências',
            '',
            'SBOM Go CycloneDX gerado com evidências de licença quando detectadas.',
            'SBOM npm CycloneDX gerado a partir de frontend/package-lock.json.',
            'Ambos os arquivos passaram pela validação do schema CycloneDX.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Verify generated-output cleanup guards
        shell: pwsh
        run: ./scripts/test-safe-cleanup.ps1

      - name: Smoke install and uninstall unsigned installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath build/bin -Filter '*-installer.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Instalador NSIS não foi encontrado para o smoke.' }
          $helper = (Resolve-Path -LiteralPath 'build/bin/installer-helper.exe').Path
          $runSuffix = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $preflightRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/verification/install-preflight-$runSuffix"
          New-Item -ItemType Directory -Force -Path $preflightRoot | Out-Null
          $preflightPath = Join-Path $preflightRoot 'preflight.json'
          & $helper preflight --install-dir (Join-Path $preflightRoot 'app') --data-dir (Join-Path $preflightRoot 'data') --free-space-path $env:ProgramData --min-free-bytes 1 --port 54329 |
            Set-Content -LiteralPath $preflightPath -Encoding utf8
          $preflightExit = $LASTEXITCODE
          if ($preflightExit -notin @(0, 2)) { throw "Preflight do ambiente retornou código inesperado: $preflightExit" }
          $preflight = Get-Content -LiteralPath $preflightPath -Raw | ConvertFrom-Json
          $issueCodes = @($preflight.issues | ForEach-Object { $_.code })
          if ($issueCodes -contains 'OS_UNSUPPORTED') {
            $otherIssues = @($issueCodes | Where-Object { $_ -ne 'OS_UNSUPPORTED' })
            if ($otherIssues.Count -gt 0) { throw "Runner não elegível e possui outros bloqueios: $($otherIssues -join ', ')" }
            @(
              '## Smoke NSIS de desktop não executado',
              '',
              'O runner hospedado é Windows Server e foi rejeitado corretamente por OS_UNSUPPORTED.',
              'O smoke de instalação/desinstalação deve ser executado em uma VM Windows 10/11 x64 workstation limpa.',
              "Códigos de preflight: $($issueCodes -join ', ')"
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Warning 'Smoke de desktop não executado: runner Windows Server fora da política suportada.'
            exit 0
          }
          $runSuffix = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ./scripts/smoke-installer.ps1 -InstallerPath $installer.FullName -OutputRoot (Join-Path $env:GITHUB_WORKSPACE "artifacts/verification/install-smoke-$runSuffix")

      - name: Smoke Windows worker service lifecycle
        shell: pwsh
        run: ./scripts/smoke-worker-service.ps1 -OutputRoot (Join-Path $env:GITHUB_WORKSPACE 'artifacts/verification/worker-service-smoke')

      - name: Consolidate generated outputs
        if: always()
        shell: pwsh
        run: ./scripts/consolidate-artifacts.ps1

      - name: Verify output consolidation
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $windowsRoot = Join-Path $artifactRoot 'windows'
          $required = @('majucau.exe', 'majucau-worker.exe', 'installer-helper.exe')
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $windowsRoot $name) -PathType Leaf)) {
              throw "Artefato final ausente em artifacts/windows: $name"
            }
          }
          foreach ($relativePath in @('verification\sbom\majucau-go.cdx.json', 'verification\sbom\frontend-npm.cdx.json')) {
            $sbomPath = Join-Path $artifactRoot $relativePath
            if (-not (Test-Path -LiteralPath $sbomPath -PathType Leaf)) {
              throw "SBOM final ausente em artifacts/$relativePath."
            }
            $sbomFile = Get-Item -LiteralPath $sbomPath
            if ($sbomFile.Length -eq 0 -or $sbomFile.Length -gt 64MB) {
              throw "SBOM vazio ou acima do limite de 64 MiB: $sbomPath"
            }
          }
          if (-not (Get-ChildItem -LiteralPath $windowsRoot -Filter '*-installer.exe' -File)) {
            throw 'Instalador final ausente em artifacts/windows.'
          }
          foreach ($relativePath in @('build\bin', 'frontend\dist', 'tmp', 'build\windows\installer\tmp\MicrosoftEdgeWebview2Setup.exe')) {
            if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $relativePath)) {
              throw "Saída intermediária permaneceu fora de artifacts: $relativePath"
            }
          }
          foreach ($cachePath in @($env:GOCACHE, $env:GOMODCACHE, $env:GOBIN, $env:npm_config_cache)) {
            $resolved = [System.IO.Path]::GetFullPath($cachePath)
            if (-not $resolved.StartsWith($artifactRoot + [System.IO.Path]::DirectorySeparatorChar, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Cache fora de artifacts: $resolved"
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $artifactRoot 'MANIFEST.txt') -PathType Leaf)) {
            throw 'Inventário artifacts/MANIFEST.txt ausente.'
          }

      - name: Upload unsigned G1 build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: majucau-g1-unsigned
          path: |
            artifacts/windows/
            artifacts/verification/
          if-no-files-found: ignore
          # This unsigned, reproducible CI output is retained only briefly.
          retention-days: 1

  verify-postgres:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_platform_checks == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: majucau
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: majucau_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U majucau -d majucau_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres_restore:
        image: postgres:18.6
        env:
          POSTGRES_USER: restore_admin
          POSTGRES_PASSWORD: ci-only-restore-password
          POSTGRES_DB: restore_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U restore_admin -d restore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GOCACHE: '${{ github.workspace }}/artifacts/cache/go-build'
      GOMODCACHE: '${{ github.workspace }}/artifacts/cache/go-mod'
      MAJUCAU_TEST_DATABASE_URL: postgres://majucau:ci-only-password@localhost:5432/majucau_test?sslmode=disable
      MAJUCAU_TEST_RESTORE_DATABASE_URL: postgres://restore_admin:ci-only-restore-password@localhost:5433/restore_test?sslmode=disable
      MAJUCAU_TEST_RECEIPTS_FOLDER: '${{ github.workspace }}/internal/integrations/bling/testdata/e2e'
      MAJUCAU_TEST_FUTURE_FOLDER: '${{ github.workspace }}/internal/integrations/nuvempago/testdata/e2e'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare centralized Go caches
        run: mkdir -p artifacts/cache/go-build artifacts/cache/go-mod

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false

      - name: Test bounded diagnostic logs on Linux
        run: go test ./internal/diagnosticslog -count=1

      - name: Vet diagnostic logs on Linux
        run: go vet ./internal/diagnosticslog

      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-common
          printf '\n' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-18
          printf '%s\n' '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          pg_dump --version | grep -Eq '^pg_dump \(PostgreSQL\) 18\.'
          pg_dumpall --version | grep -Eq '^pg_dumpall \(PostgreSQL\) 18\.'

      - name: Apply schema to disposable PostgreSQL
        run: |
          for migration in database/migrations/*.up.sql; do
            if [[ "$migration" == "database/migrations/000004_v1_access_catalog_alignment.up.sql" ]]; then
              test_sid='S-1-5-21-0000000000-0000000000-0000000000-4242'
              psql "$MAJUCAU_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
                INSERT INTO system_users (windows_sid, display_name, role_id)
                SELECT '$test_sid', 'migration guard verification', id
                  FROM roles WHERE code = 'VIEWER';
              "

              if migration_output="$(psql "$MAJUCAU_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration" 2>&1)"; then
                echo 'Migration 000004 unexpectedly accepted a user with a retired role.' >&2
                exit 1
              fi
              if [[ "$migration_output" != *'Cannot retire legacy roles while users still reference them'* ]]; then
                printf '%s\n' "$migration_output" >&2
                echo 'Migration 000004 failed for a reason other than its retired-role safety guard.' >&2
                exit 1
              fi

              legacy_role_count="$(psql "$MAJUCAU_TEST_DATABASE_URL" -Atqc "SELECT COUNT(*) FROM roles WHERE code IN ('FINANCE', 'ACCOUNTING', 'VIEWER')")"
              guarded_user_count="$(psql "$MAJUCAU_TEST_DATABASE_URL" -Atqc "SELECT COUNT(*) FROM system_users u JOIN roles r ON r.id = u.role_id WHERE u.windows_sid = '$test_sid' AND r.code = 'VIEWER'")"
              if [[ "$legacy_role_count" != '3' || "$guarded_user_count" != '1' ]]; then
                echo 'Migration 000004 changed data despite rejecting the retired-role user.' >&2
                exit 1
              fi

              psql "$MAJUCAU_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM system_users WHERE windows_sid = '$test_sid'"
              echo 'Migration 000004 retired-role guard and rollback: PASS'
            fi
            psql "$MAJUCAU_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify runtime database privileges
        run: |
          psql "$MAJUCAU_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE majucau_runtime LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
          psql "$MAJUCAU_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/privileges/runtime.sql
          psql "$MAJUCAU_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/privileges/verify_runtime.sql

      - name: Verify worker health against migrated PostgreSQL
        run: go test ./cmd/worker -run '^TestPostgresWorkerHealthProbeReportsMigratedSchema$' -count=1

      - name: Run backup creation and real restore against disposable PostgreSQL
        run: go test ./internal/backup -run '^TestCreateVerifyAndRestoreAgainstDisposablePostgres$' -count=1

      - name: Check Bling OAuth credential concurrency with race detector
        run: go test -race ./internal/integrations/bling -run '^(TestBlingOAuthLoopbackSessionExchangesAndTestsWithoutLeakingToken|TestBlingOAuthDisconnectWaitsForInFlightAuthorization)$' -count=1

      - name: Run PostgreSQL integration tests
        run: go test ./internal/dashboard ./internal/integrations/bling ./internal/integrations/googledrive ./internal/integrations/nuvempago
